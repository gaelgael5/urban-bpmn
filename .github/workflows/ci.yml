name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build the demonstration site
        run: npm run build:site

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assemble the Python package and test mount()
        run: |
          node scripts/build-python-package.mjs
          python -m pip install --quiet starlette httpx pytest
          PYTHONPATH=python python -m pytest python/tests -q
